<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Worker Login | Elite Haulerz</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/src/auth.css">
</head>
<body class="auth-page">
  <header class="auth-header">
    <a href="/" class="logo"><span class="logo-icon">EH</span> Elite Haulerz</a>
  </header>

  <main class="auth-main">
    <!-- Login -->
    <section class="auth-card" id="loginCard">
      <h1>Worker login</h1>
      <p class="lead">Sign in with your username.</p>
      <p class="form-message" id="loginMsg" role="alert" hidden></p>
      <form id="loginForm" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" autocomplete="username"
                 autocapitalize="none" spellcheck="false" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password"
                 autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary" type="submit">Log in</button>
      </form>
      <button class="link-button" type="button" id="showForgot">Forgot password?</button>
    </section>

    <!-- Forgot password -->
    <section class="auth-card" id="forgotCard" hidden>
      <h1>Reset password</h1>
      <p class="lead">Enter the email your account was set up with and we'll send a reset link.</p>
      <p class="form-message" id="forgotMsg" role="alert" hidden></p>
      <form id="forgotForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <button class="btn btn-primary" type="submit">Send reset link</button>
      </form>
      <button class="link-button" type="button" id="showLogin">Back to login</button>
    </section>
  </main>

  <script type="module">
    import { supabase, getSession, signInWithUsername, showMessage } from '/src/auth.js';

    // Already signed in? Skip straight to the dashboard.
    if (await getSession()) window.location.replace('/dashboard.html');

    const loginCard = document.getElementById('loginCard');
    const forgotCard = document.getElementById('forgotCard');
    document.getElementById('showForgot').onclick = () => {
      loginCard.hidden = true; forgotCard.hidden = false;
    };
    document.getElementById('showLogin').onclick = () => {
      forgotCard.hidden = true; loginCard.hidden = false;
    };

    const loginForm = document.getElementById('loginForm');
    const loginMsg = document.getElementById('loginMsg');
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = loginForm.username.value.trim().toLowerCase();
      const password = loginForm.password.value;
      if (!username || !password) {
        return showMessage(loginMsg, 'Enter your username and password.');
      }
      const btn = loginForm.querySelector('button');
      btn.disabled = true;
      showMessage(loginMsg, '');
      try {
        await signInWithUsername(username, password);
        window.location.replace('/dashboard.html');
      } catch (err) {
        showMessage(loginMsg, err.message);
        loginForm.password.value = '';
        btn.disabled = false;
      }
    });

    const forgotForm = document.getElementById('forgotForm');
    const forgotMsg = document.getElementById('forgotMsg');
    forgotForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = forgotForm.email.value.trim();
      if (!email) return showMessage(forgotMsg, 'Enter your email.');
      const btn = forgotForm.querySelector('button');
      btn.disabled = true;
      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: `${window.location.origin}/setup.html`,
      });
      btn.disabled = false;
      if (error?.status === 429) {
        return showMessage(forgotMsg, 'Too many requests. Try again in a few minutes.');
      }
      // Same message either way so this can't be used to check which emails exist.
      showMessage(forgotMsg,
        'If that email belongs to a worker account, a reset link is on its way.',
        'success');
    });
  </script>
</body>
</html>
