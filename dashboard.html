<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Dashboard | Elite Haulerz</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/src/auth.css">
</head>
<body class="auth-page">
  <!-- Hidden until the session check passes, so signed-out visitors don't see a flash of content. -->
  <div id="app" hidden>
    <header class="dash-bar">
      <a href="/" class="logo"><span class="logo-icon">EH</span> Elite Haulerz</a>
      <button class="btn btn-outline" id="signOut" type="button">Log out</button>
    </header>
    <main class="dash-content">
      <h1>Hi, <span id="who"></span></h1>
      <p>Worker tools will go here.</p>
    </main>
  </div>

  <script type="module">
    import { requireWorker, signOut } from '/src/auth.js';

    const worker = await requireWorker();
    if (worker) {
      document.getElementById('who').textContent = worker.profile.username;
      document.getElementById('signOut').onclick = signOut;
      document.getElementById('app').hidden = false;
    }
  </script>
</body>
</html>
